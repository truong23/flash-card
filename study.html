<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCFL Flash Cards - Band A & B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="study.css">
</head>
<body>
    <div class="container">
    <h1>TOCFL Band A & B - Từ vựng (Phồn thể)</h1>
        <div class="stats" id="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalWords">0</span>
                <span class="stat-label">📚 TỔNG CỘNG</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="a1Count">0</span>
                <span class="stat-label">🌱 BAND A1</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="a2Count">0</span>
                <span class="stat-label">🌿 BAND A2</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="b1Count">0</span>
                <span class="stat-label">🌳 BAND B1</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="b2Count">0</span>
                <span class="stat-label">🌲 BAND B2</span>
            </div>
        </div>
        
        <div class="filter-box">
          <button type="button" id="filterAllButton" class="level-filter-action active">Tất cả</button>
          <button type="button" id="filterA1Button" class="level-filter-action">Band A1</button>
          <button type="button" id="filterA2Button" class="level-filter-action">Band A2</button>
          <button type="button" id="filterB1Button" class="level-filter-action">Band B1</button>
          <button type="button" id="filterB2Button" class="level-filter-action">Band B2</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm kiếm từ vựng...">
          <button type="button" id="searchButton" class="search-action">Tìm kiếm</button>
          <button type="button" id="flipChineseButton" class="flip-chinese-action">Lật tiếng Trung</button>
          <button type="button" id="flipVietnameseButton" class="flip-vietnamese-action">Lật tiếng Việt</button>
          <button type="button" id="zoomOutButton" class="zoom-out-action">-</button>
          <span class="zoom-indicator" id="zoomIndicator">100%</span>
          <button type="button" id="zoomResetButton" class="zoom-reset-action">100%</button>
          <button type="button" id="zoomInButton" class="zoom-in-action">+</button>
        </div>
        
        <div id="wordsContainer">
        </div>
        <button id="backToTop" class="back-to-top" title="Lên đầu trang">↑</button>
    </div>
    <script src="./vocabulary-data.js"></script>

    <script src="./shared-auth.js"></script>
    <script src="./vocabulary-data.js"></script>
    <script src="./study.js"></script>
</body>
</html>
