<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập | TOCFL Flash Cards</title>
  <meta name="description" content="Luyện tập TOCFL: ôn từ vựng và luyện dịch theo từng cấp độ.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/practice/style.css?v=202605201200">
</head>

<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <a href="/" class="header-logo" id="headerLogoLink">
        <div class="logo-icon">📚</div>
        <div>
          <div class="logo-text">TOCFL Cards</div>
          <div class="logo-sub">Luyện tập</div>
        </div>
      </a>
      <nav class="header-nav">
        <a href="/study">Từ vựng</a>
        <a href="/practice" class="active">Luyện tập</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">

      <!-- CHOICE SCREEN -->
      <div id="screen-choice" class="choice-screen active">
        <div class="choice-title">
          <h1>Luyện tập hôm nay</h1>
          <p>Chọn kiểu luyện tập bạn muốn bắt đầu.</p>
        </div>

        <div class="choice-grid">
          <button type="button" class="choice-card" id="btnChoiceVocab" onclick="location.href='/practice/vocab'">
            <div class="choice-icon">📖</div>
            <div class="choice-text">
              <div class="choice-name">Ôn từ vựng</div>
              <div class="choice-sub">Làm bảng kiểm tra Trung ⇄ Việt theo band.</div>
            </div>
            <div class="choice-arrow">→</div>
          </button>

          <button type="button" class="choice-card" id="btnChoiceTranslate" onclick="location.href='/practice/translate'">
            <div class="choice-icon">✍️</div>
            <div class="choice-text">
              <div class="choice-name">Luyện dịch</div>
              <div class="choice-sub">Dịch câu Trung ⇄ Việt và chấm điểm tức thì.</div>
            </div>
            <div class="choice-arrow">→</div>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase (matching root) -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="/shared-auth.js?v=202605201200"></script>
  <script src="/practice/choice.js?v=202605201200"></script>
</body>

</html>
